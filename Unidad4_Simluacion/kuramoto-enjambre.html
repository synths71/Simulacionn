<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Enjambre Kuramoto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050510; font-family: 'Courier New', monospace; }
  #startOverlay {
    position:fixed; inset:0; background:rgba(3,3,10,0.92); color:#eee;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:20; text-align:center; padding:20px;
  }
  #startOverlay button {
    margin-top:20px; padding:14px 34px; font-size:16px; letter-spacing:1px;
    background:transparent; border:1px solid #7fe0ff; color:#7fe0ff; cursor:pointer;
    border-radius:30px; transition: all .2s;
  }
  #startOverlay button:hover { background:#7fe0ff; color:#050510; }
  #ui {
    position:fixed; left:16px; bottom:16px; color:#cdeaff; font-size:12px;
    background:rgba(10,10,25,0.75); padding:12px 16px; border-radius:10px;
    display:flex; flex-direction:column; gap:10px; width:240px; z-index:10;
    border: 1px solid rgba(127, 224, 255, 0.2);
  }
  #ui label { display:flex; flex-direction:column; gap:4px; }
  #ui input[type=range]{ width:100%; }
  #ui button {
    padding:8px; background:#1a1a35; border:1px solid #4a4a7a; color:#cdeaff;
    border-radius:6px; cursor:pointer;
  }
  #ui button:hover { background:#2a2a55; }
  #estado { position:fixed; top:14px; right:16px; color:#cdeaff; font-size:12px;
    background:rgba(10,10,25,0.75); padding:8px 14px; border-radius:8px; z-index:10;
    border: 1px solid rgba(127, 224, 255, 0.2); }
</style>
</head>
<body>

<div id="startOverlay">
  <h2 style="font-weight:400; letter-spacing:2px;">ENJAMBRE // KURAMOTO</h2>
  <p style="max-width:420px; opacity:0.8; font-size:13px; line-height:1.5;">
    Un enjambre de luciérnagas acopladas por el modelo de Kuramoto.<br>
    Toca el sistema, no solo lo observes.
  </p>
  <button id="startBtn">▶ INICIAR</button>
</div>

<div id="ui">
  <label>K global (acoplamiento) — <span id="kVal">1.00</span>
    <input type="range" id="kSlider" min="0" max="3" step="0.01" value="1">
  </label>
  <label>Rango de ω (dispersión natural) — <span id="wVal">1.00</span>
    <input type="range" id="wSlider" min="0" max="2" step="0.01" value="1">
  </label>
  <button id="perturbBtn">🌬 Perturbar enjambre</button>
  <span style="opacity:0.6; font-size:10px; line-height:1.4;">
    Clic sobre una luciérnaga para perturbarla individualmente.
  </span>
</div>

<div id="estado">r = <span id="rVal">0.00</span> — <span id="estadoTxt">desorden</span></div>

<script>
const N = 12;

const PERSONALIDADES = [
  { nombre: "Errante",  omegaBase: 2.2, mult: 0.35, color: [120, 220, 255], octava: 1 },
  { nombre: "Ancla",    omegaBase: 0.55, mult: 1.7,  color: [255, 200, 90],  octava: -1 },
  { nombre: "Rebelde",  omegaBase: 1.2, mult: 1.0,  color: [160, 255, 170], octava: 0 },
  { nombre: "Disidente",omegaBase: 1.2, mult: -0.9, color: [255, 90, 160],  octava: 0 },
];

const ESCALA = ["C3","D3","F3","G3","A3","C4","D4","F4","G4","A4","C5","D5"];

let agentes = [];
let polvoPolvo = [];
let destellosEfectos = [];
let kGlobal = 1.0;
let kObjetivo = 1.0;
let rangoOmega = 1.0;
let rangoOmegaObjetivo = 1.0;
let reverb, limiter;
let audioListo = false;

// Partículas visibles de impacto / disparo
class Destello {
  constructor(x, y, col) {
    this.pos = createVector(x, y);
    this.vel = p5.Vector.random2D().mult(random(1.5, 4));
    this.vida = 255;
    this.col = col;
    this.tam = random(3, 6);
  }
  actualizar() {
    this.pos.add(this.vel);
    this.vel.mult(0.92);
    this.vida -= 7;
  }
  dibujar() {
    noStroke();
    fill(this.col[0], this.col[1], this.col[2], this.vida);
    ellipse(this.pos.x, this.pos.y, this.tam);
  }
}

class Agente {
  constructor(i, personalidad) {
    this.i = i;
    this.p = personalidad;
    this.theta = random(TWO_PI);
    this.prevTheta = this.theta;
    this.pos = createVector(random(width * 0.15, width * 0.85), random(height * 0.15, height * 0.85));
    this.drift = p5.Vector.random2D().mult(0.15);
    this.flash = 0;
    this.resistenciaPerturbacion = 1.0;
    this.tasaRecuperacion = personalidad.nombre === "Rebelde" ? 0.0001 : 0.0004; // Recuperación más lenta
    this.faseIdle = random(TWO_PI);
    this.synth = new Tone.Synth({
      oscillator: { type: personalidad.nombre === "Ancla" ? "sine" : "triangle" },
      envelope: { attack: 0.01, decay: 0.25, sustain: 0.05, release: 0.4 }
    }).connect(reverb);
    this.synth.volume.value = -8;
  }

  omega() {
    const media = 1.2;
    return media + (this.p.omegaBase - media) * rangoOmega;
  }

  kEfectiva() {
    let base = (this.p.nombre === "Disidente") ? (-1.3 + 0.6 * kGlobal) : (kGlobal * this.p.mult);
    return base * this.resistenciaPerturbacion;
  }

  actualizar(dt) {
    let suma = 0;
    for (let otro of agentes) {
      if (otro === this) continue;
      suma += sin(otro.theta - this.theta);
    }
    const dtheta = this.omega() + (this.kEfectiva() / N) * suma;
    this.prevTheta = this.theta;
    this.theta = (this.theta + dtheta * dt) % TWO_PI;
    if (this.theta < 0) this.theta += TWO_PI;

    if (this.resistenciaPerturbacion < 1) {
      this.resistenciaPerturbacion = min(this.resistenciaPerturbacion + this.tasaRecuperacion, 1);
    }

    if (this.prevTheta > TWO_PI * 0.85 && this.theta < TWO_PI * 0.15) {
      this.disparar();
    }

    this.flash *= 0.9;

    this.pos.add(this.drift);
    if (this.pos.x < 40 || this.pos.x > width - 40) this.drift.x *= -1;
    if (this.pos.y < 40 || this.pos.y > height - 40) this.drift.y *= -1;
  }

  disparar() {
    this.flash = 1;
    for (let n = 0; n < 8; n++) {
      destellosEfectos.push(new Destello(this.pos.x, this.pos.y, this.p.color));
    }
    if (audioListo) {
      const nota = ESCALA[(this.i + this.p.octava * 3 + ESCALA.length) % ESCALA.length];
      this.synth.triggerAttackRelease(nota, "8n");
    }
  }

  perturbar() {
    this.theta = (this.theta + random(PI * 0.8, PI * 1.2)) % TWO_PI;
    this.flash = 1.0;
    this.resistenciaPerturbacion = 0.01; // Desconexión fuerte tras clic
    for (let n = 0; n < 20; n++) {
      destellosEfectos.push(new Destello(this.pos.x, this.pos.y, [255, 255, 255]));
    }
  }

  dibujar() {
    const [r, g, b] = this.p.color;
    const idle = 0.5 + 0.5 * sin(frameCount * 0.025 + this.faseIdle);
    const tam = 9 + idle * 4 + this.flash * 20;
    
    noStroke();
    for (let radio = tam * 3.8; radio > 0; radio -= 3) {
      const alpha = map(radio, 0, tam * 3.8, 80, 0) * (0.3 + idle * 0.2 + this.flash * 0.8);
      fill(r, g, b, alpha);
      ellipse(this.pos.x, this.pos.y, radio);
    }
    fill(255, 255, 255, 220 + this.flash * 35);
    ellipse(this.pos.x, this.pos.y, tam * 0.5);
  }
}

function ordenParametro() {
  let sumX = 0, sumY = 0;
  for (let a of agentes) { sumX += cos(a.theta); sumY += sin(a.theta); }
  return dist(0, 0, sumX / N, sumY / N);
}

function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  reverb = new Tone.Reverb({ decay: 3, wet: 0.35 }).toDestination();
  limiter = new Tone.Limiter(-3).toDestination();

  for (let i = 0; i < N; i++) {
    agentes.push(new Agente(i, PERSONALIDADES[i % PERSONALIDADES.length]));
  }

  // Partículas de fondo bien visibles
  for (let i = 0; i < 180; i++) {
    polvoPolvo.push({
      x: random(width), y: random(height),
      vx: random(-0.25, 0.25), vy: random(-0.25, 0.25),
      tam: random(2.5, 4.5),
      fase: random(TWO_PI)
    });
  }

  cnv.mousePressed(clicEnCanvas);
}

function draw() {
  const r = ordenParametro();
  const brillo = map(r, 0, 1, 8, 30);
  background(5 + brillo * 0.3, 5 + brillo * 0.2, 16 + brillo * 0.6, 90);

  kGlobal += (kObjetivo - kGlobal) * 0.0015;
  rangoOmega += (rangoOmegaObjetivo - rangoOmega) * 0.0015;

  // Dibujar partículas de fondo (visibles)
  noStroke();
  for (let p of polvoPolvo) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
    if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
    const alpha = 80 + 70 * sin(frameCount * 0.03 + p.fase);
    fill(140, 180, 255, alpha);
    ellipse(p.x, p.y, p.tam * (1 + r * 0.4));
  }

  // Dibujar destellos emergentes
  for (let i = destellosEfectos.length - 1; i >= 0; i--) {
    let d = destellosEfectos[i];
    d.actualizar();
    d.dibujar();
    if (d.vida <= 0) destellosEfectos.splice(i, 1);
  }

  for (let a of agentes) a.actualizar(0.045);

  // Conexiones de fase
  strokeWeight(1);
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const cercania = (cos(agentes[i].theta - agentes[j].theta) + 1) / 2;
      const alpha = 10 + cercania * cercania * 110;
      stroke(150, 200, 255, alpha);
      line(agentes[i].pos.x, agentes[i].pos.y, agentes[j].pos.x, agentes[j].pos.y);
    }
  }

  for (let a of agentes) a.dibujar();

  document.getElementById("rVal").textContent = r.toFixed(2);
  let estadoTxt = "desorden";
  if (r > 0.85) estadoTxt = "organización estable";
  else if (r > 0.4) estadoTxt = "organización parcial";
  document.getElementById("estadoTxt").textContent = estadoTxt;
}

function clicEnCanvas() {
  for (let a of agentes) {
    if (dist(mouseX, mouseY, a.pos.x, a.pos.y) < 40) {
      a.perturbar();
      break;
    }
  }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

document.getElementById("kSlider").addEventListener("input", (e) => {
  kObjetivo = parseFloat(e.target.value);
  document.getElementById("kVal").textContent = kObjetivo.toFixed(2);
});
document.getElementById("wSlider").addEventListener("input", (e) => {
  rangoOmegaObjetivo = parseFloat(e.target.value);
  document.getElementById("wVal").textContent = rangoOmegaObjetivo.toFixed(2);
});
document.getElementById("perturbBtn").addEventListener("click", () => {
  const copia = [...agentes];
  for (let n = 0; n < 3; n++) {
    const idx = floor(random(copia.length));
    copia[idx].perturbar();
    copia.splice(idx, 1);
  }
});
document.getElementById("startBtn").addEventListener("click", async () => {
  await Tone.start();
  audioListo = true;
  document.getElementById("startOverlay").style.display = "none";
});
</script>
</body>
</html>
